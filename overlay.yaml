# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/refs/heads/main/schemas/v1.0/schema.yaml
overlay: 1.0.0
info:
  title: Standardize Server and Security Configurations
  version: 1.1.0
actions:
  - target: "$.paths.*.*.requestBody.content.*.schema.properties.*.[?@.exclusiveMinimum==0]"
    replace:
      exclusiveMinimum: false
  - target: "$.paths.*.*.requestBody.content.*.schema.properties.*.[?@.exclusiveMinimum==1]"
    replace:
      exclusiveMinimum: true
